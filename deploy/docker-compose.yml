version: '3.8'

services:
  sambav2:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: sambav2
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./backend/sambav2.db:/app/sambav2.db
    environment:
      - APP_NAME=SambaV2
      - DEBUG=false
      - SECRET_KEY=change-this-to-a-random-string
      - CIPHER_KEY=change-this-to-another-random-string

  # 可选：Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: sambav2-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sambav2
